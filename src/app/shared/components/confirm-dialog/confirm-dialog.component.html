<h2 mat-dialog-title>{{ data.title }}</h2>

<div class="dialog-content">
  <p>{{ data.message }}</p>
</div>

<div class="form-actions">
  <button class="btn-cancel" mat-button type="button" (click)="close()">Cancelar</button>
  <button class="btn-delete" mat-raised-button color="warn" type="button" (click)="confirm()">Excluir</button>
</div>
